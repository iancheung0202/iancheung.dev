{% extends "base.html" %}
{% block content %}
<article class="prose">
  <h1>{{ page.title }}</h1>
  {{ page.content | safe }}
</article>
{% endblock content %}
{% block scripts %}
<script>
  // fill in the computed value of each swatch, so the page always matches tokens.css
  (function () {
    var style = getComputedStyle(document.documentElement);
    function fill() {
      document.querySelectorAll('[data-token]').forEach(function (el) {
        el.textContent = style.getPropertyValue('--' + el.dataset.token).trim();
      });
    }
    fill();
    new MutationObserver(fill).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  })();
</script>
{% endblock scripts %}
