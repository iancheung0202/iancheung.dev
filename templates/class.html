<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="robots" content="noindex">
    <title>Ian Cheung - Notes</title>
    <link href="/assets/img/favicon.png" rel="icon">
    <link href="/assets/img/apple-touch-icon.png" rel="apple-touch-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet"></noscript>
    <link href="/assets/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  </head>
  <body>
    <div class="class-shell">
      <div class="container">
        <div class="class-topbar">
          <a class="class-back" href="/"><i class="bi bi-house"></i> Back to Home</a>
          <button type="button" class="class-theme-toggle" id="class-theme-toggle" title="Enable Dark Mode" aria-label="Enable Dark Mode">
            <i class="bi bi-sun-fill"></i>
          </button>
        </div>

        <div class="section-title">
          <h2>class</h2>
          <p>notes &amp; files</p>
        </div>
        <p class="paragraph">My course notes, cheat sheets, and some old assignments.</p>

        <div class="story-wrap">
          <aside class="story-sidebar">
            <ul class="story-tree" id="class-tree">
              <li class="story-status">loading&hellip;</li>
            </ul>
          </aside>

          <div class="story-page" id="class-page">
            <div class="story-status">loading&hellip;</div>
          </div>
        </div>
      </div>
    </div>

    <script src="/assets/js/class.js" defer></script>
  </body>
</html>
