# docker compose up -d --build
# content/ is mounted so pages saved through the story editor land in the
# repo checkout (commit them afterwards); data/ holds wall notes and todos.
services:
  site:
    build: .
    image: iancheung-dev-site
    container_name: iancheung-dev
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file: .env
    volumes:
      - ./content:/app/content
      - ./data:/app/data
